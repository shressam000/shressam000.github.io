<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Studio4Brow offers precise threading, tinting, lamination, waxing, lash, and facial services in Seattle and Lynnwood.">
<title>Studio4Brow â€” Brow &amp; Lash Studio</title>
<style>:root {
  --white: #ffffff;
  --soft: #f5f5f7;
  --soft-warm: #faf9f8;
  --ink: #1d1d1f;
  --ink-soft: #6e6e73;
  --red: #9f1f35;
  --red-dark: #7e1729;
  --line: rgba(29, 29, 31, 0.12);
  --max: 1180px;
  --radius: 24px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--white);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  font-size: 1rem;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

main {
  flex: 1;
}

a {
  color: inherit;
  text-decoration: none;
}

img {
  display: block;
  max-width: 100%;
}

button,
input,
select,
textarea {
  font: inherit;
}

a:focus-visible,
button:focus-visible {
  outline: 2px solid var(--red);
  outline-offset: 4px;
}

.wrap {
  width: min(100% - 48px, var(--max));
  margin-inline: auto;
}

/* Header */

.site-header {
  position: sticky;
  top: 0;
  z-index: 30;
}

.nav-bar {
  background: rgba(255, 255, 255, 0.88);
  border-bottom: 1px solid rgba(29, 29, 31, 0.06);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  transition: box-shadow 200ms ease, background 200ms ease;
}

.site-header.scrolled .nav-bar {
  background: rgba(255, 255, 255, 0.94);
  box-shadow: 0 1px 12px rgba(29, 29, 31, 0.07);
}

.nav-bar nav {
  width: min(100% - 48px, var(--max));
  min-height: 58px;
  margin-inline: auto;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 26px;
  position: relative;
}

.logo {
  font-size: 1.04rem;
  font-weight: 650;
  letter-spacing: -0.035em;
  white-space: nowrap;
}

.logo span {
  color: var(--red);
}

.nav-links {
  justify-self: end;
  display: flex;
  align-items: center;
  gap: clamp(18px, 2.35vw, 34px);
}

.nav-links a,
.nav-cta,
.menu-btn {
  font-size: 0.77rem;
  font-weight: 450;
  letter-spacing: -0.005em;
}

.nav-links a {
  color: #4d4d51;
  transition: color 160ms ease;
}

.nav-links a[data-page="services"] {
  position: relative;
  z-index: 0;
  display: inline-flex;
  align-items: center;
  padding: 7px 11px;
  margin: -7px -11px;
  border-radius: 999px;
  transition: color 180ms ease, background 180ms ease, box-shadow 180ms ease, transform 180ms ease;
}

.nav-links a[data-page="services"]:hover {
  z-index: 1;
  color: var(--white);
  background: var(--red);
  box-shadow: 0 7px 22px rgba(159, 31, 53, 0.34), 0 0 18px rgba(159, 31, 53, 0.24);
  transform: translateY(-3px) scale(1.08);
}

.nav-links a[data-page="services"][aria-current="page"] {
  color: var(--red);
  background: rgba(159, 31, 53, 0.08);
  box-shadow: 0 0 15px rgba(159, 31, 53, 0.14);
}

.nav-links a[data-page="services"][aria-current="page"]:hover {
  color: var(--white);
  background: var(--red);
  box-shadow: 0 7px 22px rgba(159, 31, 53, 0.34), 0 0 18px rgba(159, 31, 53, 0.24);
}

.nav-links a:hover,
.nav-links a[aria-current="page"] {
  color: var(--red);
}

.nav-cta {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 32px;
  padding: 6px 15px;
  border-radius: 999px;
  background: var(--red);
  color: var(--white);
  font-weight: 600;
  transition: background 160ms ease, transform 160ms ease;
}

.nav-cta:hover,
.nav-cta[aria-current="page"] {
  background: var(--red-dark);
}

.nav-cta:hover {
  transform: translateY(-1px);
}

.menu-btn {
  display: none;
  border: 0;
  background: transparent;
  color: var(--ink);
  cursor: pointer;
}

/* Type and controls */

h1,
h2,
h3 {
  font-weight: 650;
  letter-spacing: -0.045em;
}

.eyebrow,
.mono {
  display: block;
  color: var(--red);
  font-size: 0.82rem;
  font-weight: 600;
  letter-spacing: 0.01em;
}

.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 46px;
  padding: 11px 22px;
  border: 0;
  border-radius: 999px;
  background: var(--red);
  color: var(--white);
  font-size: 0.92rem;
  font-weight: 600;
  line-height: 1.2;
  transition: background 180ms ease, transform 180ms ease;
}

.button:hover {
  background: var(--red-dark);
  transform: translateY(-1px);
}

.button-light {
  background: var(--white);
  color: var(--red-dark);
}

.button-light:hover {
  background: var(--soft);
  color: var(--red-dark);
}

.text-link {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: var(--red);
  font-size: 0.96rem;
  font-weight: 550;
}

.text-link span {
  transition: transform 180ms ease;
}

.text-link:hover span {
  transform: translateX(3px);
}

.text-link-light {
  color: var(--white);
}

/* Home */

.home-intro {
  min-height: min(690px, calc(100vh - 58px));
  padding: clamp(96px, 13vw, 170px) 0;
  display: grid;
  place-items: center;
  background: var(--white);
  text-align: center;
}

.intro-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.home-intro h1 {
  max-width: 920px;
  margin-top: 17px;
  font-size: clamp(4.25rem, 8.7vw, 7.8rem);
  font-weight: 650;
  line-height: 0.92;
  letter-spacing: -0.07em;
}

.home-intro p {
  max-width: 38ch;
  margin-top: 27px;
  color: var(--ink-soft);
  font-size: clamp(1.05rem, 1.6vw, 1.28rem);
  line-height: 1.45;
}

.home-intro .button {
  margin-top: 32px;
}

.gallery-showcase {
  padding: clamp(72px, 9vw, 112px) 0;
  background: var(--soft);
}

.section-title {
  margin-bottom: 40px;
  text-align: center;
}

.section-title h1,
.section-title h2 {
  font-size: clamp(2.35rem, 5.2vw, 4.8rem);
  line-height: 1;
}

.section-title span {
  display: none;
}

.gallery-grid-home {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

.gallery-grid-home .gallery-item:first-child,
.gallery-grid-home .gallery-item:last-child {
  grid-column: 1 / -1;
  aspect-ratio: 16 / 8;
}

.gallery-item {
  position: relative;
  overflow: hidden;
  border-radius: var(--radius);
  background: #e8e8ed;
  aspect-ratio: 3 / 2;
}

.gallery-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 700ms cubic-bezier(0.16, 0.8, 0.28, 1);
}

.gallery-item:hover img {
  transform: scale(1.018);
}

.center-action {
  margin-top: 36px;
  text-align: center;
}

.service-callout {
  padding: clamp(88px, 11vw, 140px) 0;
  background: var(--red);
  color: var(--white);
  text-align: center;
}

.service-callout-inner p {
  color: rgba(255, 255, 255, 0.72);
  font-size: 0.9rem;
  font-weight: 550;
}

.service-callout h2 {
  margin-top: 12px;
  font-size: clamp(3.25rem, 7.2vw, 6.8rem);
  line-height: 0.98;
  letter-spacing: -0.065em;
}

.callout-actions {
  margin-top: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
}

/* Gallery */

.page-section,
#about,
#services,
#reviews,
#book,
#contact {
  padding: clamp(72px, 9vw, 120px) 0;
}

.gallery-page-section {
  padding-top: clamp(72px, 9vw, 112px);
}

.section-title-page {
  max-width: 900px;
  margin: 0 auto 58px;
}

.gallery-grid-full {
  columns: 2;
  column-gap: 18px;
}

.gallery-grid-full .gallery-item {
  margin-bottom: 18px;
  break-inside: avoid;
}

.gallery-crop-tall {
  aspect-ratio: 4 / 5;
}

.gallery-crop-square {
  aspect-ratio: 1;
}

/* Interior pages */

.section-head {
  max-width: 800px;
  margin: 0 auto 72px;
  text-align: center;
}

.section-head h1 {
  margin-top: 10px;
  font-size: clamp(2.9rem, 6vw, 5.6rem);
  line-height: 0.98;
  letter-spacing: -0.06em;
}

.section-head p {
  max-width: 50ch;
  margin: 22px auto 0;
  color: var(--ink-soft);
  font-size: 1.08rem;
}

.about-grid {
  display: grid;
  grid-template-columns: minmax(0, 0.82fr) minmax(0, 1.18fr);
  gap: clamp(48px, 7vw, 90px);
  align-items: center;
}

.about-copy {
  color: #37373a;
  font-size: clamp(1.15rem, 2vw, 1.45rem);
  line-height: 1.52;
  letter-spacing: -0.018em;
}

.about-copy p + p {
  margin-top: 24px;
}

.about-visual img {
  width: 100%;
  aspect-ratio: 3 / 2;
  border-radius: var(--radius);
  object-fit: cover;
}

.stat {
  margin-top: 18px;
  display: flex;
  justify-content: space-between;
  gap: 24px;
  color: var(--ink-soft);
  font-size: 0.9rem;
}

.stat .num {
  color: var(--ink);
  font-weight: 650;
}

.service-category {
  margin-top: 74px;
}

.service-category:first-of-type {
  margin-top: 0;
}

.service-category + .service-category {
  padding-top: 68px;
  border-top: 1px solid var(--line);
}

.service-category-title {
  margin-bottom: 24px;
  color: var(--ink);
  font-size: clamp(1.8rem, 3.5vw, 2.65rem);
  letter-spacing: -0.045em;
}

.service-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.service-card {
  min-height: 72px;
  padding: 19px 21px;
  border-radius: 16px;
  background: var(--soft);
}

.service-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 24px;
}

.service-top h3 {
  font-size: 1rem;
  font-weight: 550;
  letter-spacing: -0.015em;
}

.service-price {
  flex: none;
  color: var(--red);
  font-weight: 650;
}

.service-meta {
  margin-top: 6px;
  color: var(--ink-soft);
  font-size: 0.78rem;
}

.services-booking {
  margin-top: clamp(84px, 11vw, 132px);
  padding: clamp(64px, 8vw, 104px) 24px;
  border-radius: 32px;
  background: var(--red);
  color: var(--white);
  text-align: center;
}

.services-booking .mono {
  color: rgba(255, 255, 255, 0.72);
}

.services-booking h2 {
  max-width: 820px;
  margin: 14px auto 30px;
  font-size: clamp(2.6rem, 6vw, 5.4rem);
  line-height: 0.98;
  letter-spacing: -0.06em;
}

.services-booking .button {
  background: var(--white);
  color: var(--red-dark);
}

.services-booking .button:hover {
  background: var(--soft);
}

.review-controls {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  margin-bottom: 18px;
}

.review-count {
  margin-right: auto;
  color: var(--ink-soft);
  font-size: 0.82rem;
  font-weight: 550;
}

.review-control {
  width: 42px;
  height: 42px;
  border: 0;
  border-radius: 50%;
  background: var(--soft);
  color: var(--ink);
  cursor: pointer;
  transition: background 180ms ease, color 180ms ease;
}

.review-control:hover:not(:disabled) {
  background: var(--red);
  color: var(--white);
}

.review-control:disabled {
  opacity: 0.35;
  cursor: default;
}

.review-grid {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: min(520px, 78vw);
  gap: 16px;
  overflow-x: auto;
  padding-bottom: 18px;
  scroll-snap-type: x mandatory;
  scrollbar-color: var(--red) var(--soft);
}

.review-card {
  min-height: 330px;
  padding: 32px;
  border-radius: var(--radius);
  background: var(--soft);
  scroll-snap-align: start;
}

.review-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 28px;
}

.review-name {
  font-weight: 650;
}

.review-location,
.review-date,
.review-updated {
  color: var(--ink-soft);
  font-size: 0.82rem;
}

.review-date {
  flex: none;
}

.elite-badge {
  display: inline-block;
  margin-top: 6px;
  color: var(--red);
  font-size: 0.78rem;
  font-weight: 650;
}

.review-card blockquote {
  color: #37373a;
  font-size: 1.14rem;
  line-height: 1.52;
  letter-spacing: -0.015em;
}

.review-card blockquote p + p {
  margin-top: 14px;
}

.book-grid {
  display: grid;
  grid-template-columns: minmax(250px, 0.7fr) minmax(0, 1.3fr);
  gap: 18px;
  align-items: start;
}

.book-info {
  padding: 32px;
  border-radius: var(--radius);
  background: var(--soft);
}

.book-info > p {
  color: #37373a;
  font-size: 1.2rem;
  line-height: 1.45;
  letter-spacing: -0.02em;
}

.detail {
  margin-top: 28px;
  padding-top: 22px;
  border-top: 1px solid var(--line);
}

.detail .mono {
  margin-bottom: 7px;
}

.detail a,
.contact-block a {
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.square-booking {
  min-height: 520px;
  padding: 22px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: var(--radius);
}

.contact-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}

.contact-block {
  min-height: 220px;
  padding: 30px;
  border-radius: var(--radius);
  background: var(--soft);
}

.contact-block .mono {
  margin-bottom: 24px;
}

.location {
  margin-bottom: 24px;
}

.location:last-child {
  margin-bottom: 0;
}

.location-phone {
  display: inline-block;
  margin-top: 10px;
}

.contact-photo {
  margin-top: 18px;
  overflow: hidden;
  border-radius: var(--radius);
}

.contact-photo img {
  width: 100%;
  max-height: 640px;
  object-fit: cover;
}

/* Footer */

footer {
  padding: 34px 0;
  border-top: 1px solid rgba(29, 29, 31, 0.08);
  background: var(--white);
  color: var(--ink-soft);
  font-size: 0.78rem;
}

.footer-row {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 30px;
  align-items: center;
}

.footer-row div:nth-child(2) {
  text-align: center;
}

.footer-row div:last-child {
  text-align: right;
}

/* Motion */

.reveal {
  opacity: 0;
  transform: translateY(14px);
  transition: opacity 600ms ease, transform 600ms cubic-bezier(0.16, 0.8, 0.28, 1);
}

.reveal.visible {
  opacity: 1;
  transform: translateY(0);
}

.reveal-1 {
  transition-delay: 70ms;
}

.reveal-2 {
  transition-delay: 140ms;
}

.reveal-3 {
  transition-delay: 210ms;
}

.reveal-4 {
  transition-delay: 280ms;
}

.reveal-5 {
  transition-delay: 350ms;
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }

  .reveal {
    opacity: 1;
    transform: none;
  }
}

@media (max-width: 860px) {
  .nav-bar nav {
    grid-template-columns: 1fr auto auto;
    gap: 18px;
  }

  .menu-btn {
    display: block;
  }

  .nav-links {
    display: none;
    position: absolute;
    top: calc(100% - 1px);
    left: -24px;
    right: -24px;
    padding: 14px 24px 22px;
    flex-direction: column;
    align-items: stretch;
    gap: 0;
    background: rgba(255, 255, 255, 0.98);
    border-top: 1px solid var(--line);
    box-shadow: 0 18px 28px rgba(29, 29, 31, 0.1);
  }

  .nav-links.open {
    display: flex;
  }

  .nav-links a {
    padding: 12px 2px;
    border-bottom: 1px solid var(--line);
    font-size: 0.9rem;
  }

  .nav-links a[data-page="services"] {
    margin: 0;
    padding: 12px 10px;
    border-radius: 10px;
  }

  .nav-links a[data-page="services"]:hover {
    transform: translateX(4px) scale(1.01);
  }

  .about-grid,
  .book-grid {
    grid-template-columns: 1fr;
  }

  .contact-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .contact-block:last-child {
    grid-column: 1 / -1;
  }
}

@media (max-width: 680px) {
  .wrap,
  .nav-bar nav {
    width: min(100% - 32px, var(--max));
  }

  .nav-bar nav {
    min-height: 54px;
    gap: 14px;
  }

  .nav-links {
    left: -16px;
    right: -16px;
    padding-inline: 16px;
  }

  .logo {
    font-size: 0.96rem;
  }

  .nav-cta {
    min-height: 30px;
    padding: 5px 12px;
  }

  .home-intro {
    min-height: 620px;
    padding: 90px 0;
  }

  .home-intro h1 {
    font-size: clamp(3.4rem, 17vw, 5.2rem);
  }

  .home-intro p {
    max-width: 30ch;
  }

  .section-title {
    margin-bottom: 28px;
  }

  .section-title h1,
  .section-title h2 {
    font-size: clamp(2.15rem, 11vw, 3.2rem);
  }

  .gallery-grid-home {
    grid-template-columns: 1fr;
    gap: 12px;
  }

  .gallery-grid-home .gallery-item:first-child,
  .gallery-grid-home .gallery-item:last-child {
    grid-column: auto;
    aspect-ratio: 3 / 2;
  }

  .gallery-grid-full {
    columns: 1;
  }

  .gallery-grid-full .gallery-item {
    margin-bottom: 12px;
  }

  .gallery-item {
    border-radius: 18px;
  }

  .callout-actions {
    flex-direction: column;
    gap: 18px;
  }

  .service-grid,
  .contact-grid {
    grid-template-columns: 1fr;
  }

  .contact-block:last-child {
    grid-column: auto;
  }

  .service-category {
    margin-top: 54px;
  }

  .service-category + .service-category {
    padding-top: 48px;
  }

  .services-booking {
    margin-top: 72px;
    border-radius: 24px;
  }

  .review-grid {
    grid-auto-columns: 88vw;
  }

  .review-card {
    min-height: 0;
    padding: 24px;
    border-radius: 18px;
  }

  .footer-row {
    grid-template-columns: 1fr;
    gap: 7px;
    text-align: center;
  }

  .footer-row div:last-child {
    text-align: center;
  }
}

/* Keep content visible in the noninteractive portfolio preview. */
.reveal { opacity:1 !important; transform:none !important; }

html, body { overflow:hidden !important; }
</style>
</head>

      <div class="nav-links" id="primary-navigation">

      </div>
      <a href="book.html" class="nav-cta">Book</a>

  </div>
</header>

<main>
